<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочник исследований</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      color: #182944;
      background: #f4f7fa;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      box-sizing: border-box;
      width: min(38rem, calc(100% - 2rem));
      margin: 2rem 0;
      padding: clamp(1.25rem, 5vw, 2.5rem);
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 1rem;
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      line-height: 1.15;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }
    a {
      box-sizing: border-box;
      flex: 1 1 13rem;
      padding: .75rem 1rem;
      border: 1px solid #183c68;
      border-radius: .625rem;
      color: #183c68;
      background: #fff;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    a:first-child {
      background: #183c68;
      color: #fff;
    }
    a:hover { text-decoration: underline; }
    a:focus-visible {
      outline: 3px solid #1767ad;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Справочник исследований</h1>
    <nav aria-label="Версии справочника">
      <a href="./desktop/">Открыть на компьютере</a>
      <a href="./pwa/">Открыть на iPhone</a>
    </nav>
  </main>
</body>
</html>
